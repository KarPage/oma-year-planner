<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Omarchy Year Planner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03200d"/>
      <stop offset="1" stop-color="#000d04"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#41a468" stroke-opacity=".45" stroke-width="3"/>
  <!-- 12 months: 4 columns x 3 rows -->
  <g fill="#41a468" fill-opacity=".22">
    <rect x="104" y="128" width="64" height="64" rx="12"/>
    <rect x="184" y="128" width="64" height="64" rx="12"/>
    <rect x="264" y="128" width="64" height="64" rx="12"/>
    <rect x="344" y="128" width="64" height="64" rx="12"/>
    <rect x="104" y="224" width="64" height="64" rx="12"/>
    <rect x="344" y="224" width="64" height="64" rx="12"/>
    <rect x="104" y="320" width="64" height="64" rx="12"/>
    <rect x="184" y="320" width="64" height="64" rx="12"/>
    <rect x="344" y="320" width="64" height="64" rx="12"/>
  </g>
  <!-- trip bar spanning months -->
  <rect x="184" y="224" width="144" height="64" rx="12" fill="#41a468" filter="url(#glow)"/>
  <!-- today -->
  <rect x="264" y="320" width="64" height="64" rx="12" fill="#d9a55a" filter="url(#glow)"/>
</svg>
